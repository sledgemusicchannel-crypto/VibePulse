<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibePulse — Live Stream & Social App</title>

    <!-- Firebase Web SDK (v10 Compat Layer) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --accent: #2563eb;
            --accent-pink: #fe2c55;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header Bar */
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.98);
            border-bottom: 1px solid #334155;
            z-index: 100;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .user-badge {
            font-size: 0.8rem;
            background: #334155;
            padding: 4px 8px;
            border-radius: 6px;
        }

        /* Sub-Header Feature Bar (Jukebox, PK, Live, Radio, Lounge, etc.) */
        .feature-bar {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 8px 12px;
            background: #090d16;
            border-bottom: 1px solid #1e293b;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .feature-bar::-webkit-scrollbar { display: none; }

        .feature-pill {
            background: #1e293b;
            color: var(--text-light);
            border: none;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .feature-pill.active {
            background: var(--accent-pink);
        }

        /* Main App Area */
        .main-content {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        .live-preview {
            width: 100%;
            height: 100%;
            position: relative;
            background: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
        }

        /* Properly Contain Camera Feed so it doesn't overflow */
        #live-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 60px;
            background: #0f172a;
            border-top: 1px solid #334155;
            z-index: 100;
        }

        .nav-item {
            color: var(--text-muted);
            background: none;
            border: none;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--text-light);
        }

        /* Dual Action Plus Button */
        .btn-plus {
            width: 42px;
            height: 30px;
            background: linear-gradient(90deg, #00f2fe 0%, #fe2c55 100%);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: bold;
            font-size: 1.3rem;
            border: none;
            cursor: pointer;
        }

        /* Modal Container */
        .tiktok-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 200;
            justify-content: center;
            align-items: flex-end;
        }

        .tiktok-modal.active {
            display: flex !important;
        }

        .modal-body-container {
            width: 100%;
            max-width: 500px;
            background: var(--bg-card);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .modal-close {
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .btn {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-secondary {
            background: #334155;
            color: white;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <!-- Header Navigation Bar -->
    <header class="header-bar">
        <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="handleBackAction()">◄ Back</button>
        <span class="header-title">⚡ VibePulse Live</span>
        <div class="header-actions">
            <span class="user-badge" id="wallet-badge" onclick="openTikTokModal('shop-modal')" style="cursor:pointer;">💎 0 Coins</span>
            <span class="user-badge" id="user-display">Guest</span>
            <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="openTikTokModal('auth-modal')">Sign In</button>
        </div>
    </header>

    <!-- Sub-Header Feature Bar (Restored All Features) -->
    <div class="feature-bar">
        <button class="feature-pill active" onclick="switchFeature('live')">🔴 VibePulse Live</button>
        <button class="feature-pill" onclick="switchFeature('jukebox')">🎵 Jukebox</button>
        <button class="feature-pill" onclick="switchFeature('rooms')">🏠 Rooms</button>
        <button class="feature-pill" onclick="switchFeature('pk')">⚔️ PK Battles</button>
        <button class="feature-pill" onclick="switchFeature('gifts')">🎁 Gifts</button>
        <button class="feature-pill" onclick="switchFeature('buzz')">🔥 Buzz</button>
        <button class="feature-pill" onclick="switchFeature('youtube')">▶️ YouTube</button>
        <button class="feature-pill" onclick="switchFeature('presence')">🟢 Online Presence</button>
        <button class="feature-pill" onclick="switchFeature('lounge')">🌐 Global Lounge</button>
        <button class="feature-pill" onclick="switchFeature('radio')">📻 Live Radio</button>
    </div>

    <!-- Main View Content -->
    <main class="main-content">
        <div class="live-preview" id="preview-area">
            🎥 Tap '+' to start streaming or select a feature above
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchFeature('live')">🏠<span>Home</span></button>
        <button class="nav-item" onclick="openTikTokModal('shop-modal')">💎<span>Store & Wallet</span></button>
        <button class="btn-plus" onclick="openTikTokModal('plus-modal')">+</button>
        <button class="nav-item" onclick="switchFeature('buzz')">💬<span>Inbox</span></button>
        <button class="nav-item" onclick="openTikTokModal('auth-modal')">👤<span>Profile</span></button>
    </nav>

    <!-- 1. DUAL ACTION '+' MODAL -->
    <div class="tiktok-modal" id="plus-modal">
        <div class="modal-body-container">
            <div class="modal-header">
                <span>Create & Broadcast</span>
                <span class="modal-close" onclick="closeTikTokModal('plus-modal')">✕</span>
            </div>
            <button class="btn btn-primary" onclick="startLiveCamera()">🎥 Go Live Broadcast</button>
            <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">📁 Select Local Media File</button>
            <input type="file" id="file-input" style="display: none;" accept="video/*,image/*" onchange="handleFileSelect(event)">
        </div>
    </div>

    <!-- 2. AUTHENTICATION MODAL -->
    <div class="tiktok-modal" id="auth-modal">
        <div class="modal-body-container">
            <div class="modal-header">
                <span>Sign In or Register Account</span>
                <span class="modal-close" onclick="closeTikTokModal('auth-modal')">✕</span>
            </div>
            <input type="text" class="input-field" id="auth-username" placeholder="Account Handle / Username">
            <input type="email" class="input-field" id="auth-email" placeholder="Email Address">
            <input type="password" class="input-field" id="auth-password" placeholder="Password">
            <button class="btn btn-primary" onclick="handleAuth()">Sign In / Register Now</button>
        </div>
    </div>

    <!-- 3. CREDIT CARD CHECKOUT SHOP & WALLET MODAL -->
    <div class="tiktok-modal" id="shop-modal">
        <div class="modal-body-container">
            <div class="modal-header">
                <span>💎 Diamond Store & Wallet</span>
                <span class="modal-close" onclick="closeTikTokModal('shop-modal')">✕</span>
            </div>
            <div style="background: #0f172a; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 5px;">
                <div style="font-size: 0.8rem; color: #94a3b8;">Your Current Balance</div>
                <div style="font-size: 1.3rem; font-weight: bold; color: #00f2fe;" id="wallet-balance-display">💎 0 Diamonds</div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                
                <!-- Tier 1: 100 Diamonds -->
                <div style="display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px; border-radius: 8px;">
                    <div>
                        <strong style="color: #fff; font-size: 0.95rem;">💎 100 Diamonds</strong>
                        <div style="font-size: 0.75rem; color: #94a3b8;">$1.00 USD</div>
                    </div>
                    <button class="btn btn-primary" style="padding: 8px 12px; font-size: 0.85rem;" onclick="buyCoinsCheckout('vibepulse_coins_100', 100, 1.00)">
                        Pay $1.00
                    </button>
                </div>

                <!-- Tier 2: 500 Diamonds -->
                <div style="display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px; border-radius: 8px;">
                    <div>
                        <strong style="color: #fff; font-size: 0.95rem;">💎 500 Diamonds</strong>
                        <div style="font-size: 0.75rem; color: #94a3b8;">$5.00 USD</div>
                    </div>
                    <button class="btn btn-primary" style="padding: 8px 12px; font-size: 0.85rem;" onclick="buyCoinsCheckout('vibepulse_coins_500', 500, 5.00)">
                        Pay $5.00
                    </button>
                </div>

                <!-- Tier 3: 2,000 Diamonds -->
                <div style="display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px; border-radius: 8px;">
                    <div>
                        <strong style="color: #fff; font-size: 0.95rem;">💎 2,000 Diamonds</strong>
                        <div style="font-size: 0.75rem; color: #94a3b8;">$20.00 USD</div>
                    </div>
                    <button class="btn btn-primary" style="padding: 8px 12px; font-size: 0.85rem;" onclick="buyCoinsCheckout('vibepulse_coins_2000', 2000, 20.00)">
                        Pay $20.00
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        // --- 1. FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            authDomain: "vibepulse-21950.firebaseapp.com",
            projectId: "vibepulse-21950",
            storageBucket: "vibepulse-21950.appspot.com"
        };

        let auth = null;
        let db = null;

        try {
            if (typeof firebase !== 'undefined') {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                auth = firebase.auth();
                db = firebase.firestore();

                auth.onAuthStateChanged((user) => {
                    if (user) {
                        const name = user.displayName || user.email.split('@')[0];
                        document.getElementById('user-display').innerText = name;
                    } else {
                        document.getElementById('user-display').innerText = "Guest";
                    }
                });
            }
        } catch (e) {
            console.warn("Firebase standby mode:", e);
        }

        // Modal Controls
        function openTikTokModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.add('active');
        }

        function closeTikTokModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.remove('active');
        }

        // Feature Switcher for Sub-Header Bar
        function switchFeature(feature) {
            // Update pill highlights
            document.querySelectorAll('.feature-pill').forEach(p => p.classList.remove('active'));
            event && event.target && event.target.classList.add('active');

            const preview = document.getElementById('preview-area');
            
            switch(feature) {
                case 'live':
                    preview.innerHTML = `🎥 VibePulse Live Stream Feed — Tap '+' to broadcast`;
                    break;
                case 'jukebox':
                    preview.innerHTML = `🎵 Jukebox Hub — Request & Queue Your Favorite Tracks`;
                    break;
                case 'rooms':
                    preview.innerHTML = `🏠 Live Voice & Video Social Rooms — Join a room below`;
                    break;
                case 'pk':
                    preview.innerHTML = `⚔️ PK Battles Arena — Creator vs Creator Live Match`;
                    break;
                case 'gifts':
                    preview.innerHTML = `🎁 Virtual Gift Shop & Animation Effects Center`;
                    break;
                case 'buzz':
                    preview.innerHTML = `🔥 Buzz Feed — Trending Short Clips & Creator Updates`;
                    break;
                case 'youtube':
                    preview.innerHTML = `▶️ YouTube Integration Player — Stream Synced Media`;
                    break;
                case 'presence':
                    preview.innerHTML = `🟢 Online Presence Tracker — Active Users Worldwide`;
                    break;
                case 'lounge':
                    preview.innerHTML = `🌐 Global Lounge — VIP Community Chatroom`;
                    break;
                case 'radio':
                    preview.innerHTML = `📻 Live Radio Stream — 24/7 Independent Music`;
                    break;
            }
        }

        // Back Button Handler
        function handleBackAction() {
            const videoEl = document.getElementById('live-video');
            if (videoEl && videoEl.srcObject) {
                const tracks = videoEl.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                videoEl.srcObject = null;
                document.getElementById('preview-area').innerHTML = `🎥 Stream ended. Tap '+' to start streaming.`;
            } else {
                window.history.back();
            }
        }

        // --- 2. AUTHENTICATION HANDLER ---
        function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const username = document.getElementById('auth-username').value;

            if (!email || !password) {
                alert("Please fill in both email and password.");
                return;
            }

            const displayName = username || email.split('@')[0];
            document.getElementById('user-display').innerText = displayName;
            closeTikTokModal('auth-modal');
            alert("Signed in successfully as " + displayName + "!");
        }

        // --- 3. PROPERLY CONTAINED CAMERA STREAM ---
        function startLiveCamera() {
            closeTikTokModal('plus-modal');
            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then((stream) => {
                    const preview = document.getElementById('preview-area');
                    preview.innerHTML = `<video id="live-video" autoplay playsinline muted></video>`;
                    document.getElementById('live-video').srcObject = stream;
                })
                .catch((err) => alert("Camera permission error: " + err.message));
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                closeTikTokModal('plus-modal');
                const fileUrl = URL.createObjectURL(file);
                const preview = document.getElementById('preview-area');
                if (file.type.startsWith('video/')) {
                    preview.innerHTML = `<video src="${fileUrl}" id="live-video" controls autoplay></video>`;
                } else {
                    preview.innerHTML = `<img src="${fileUrl}" style="width:100%; height:100%; object-fit:contain; background:#000;">`;
                }
            }
        }

        // --- 4. LIVE LEMON SQUEEZY CARD CHECKOUT PROCESSOR ---
        function buyCoinsCheckout(sku, coinAmount, priceUsd) {
            const cardPaymentLinks = {
                'vibepulse_coins_100': 'https://apexmobilitysystem.lemonsqueezy.com/checkout/buy/c9b4c4a0-21be-4d8a-a205-d0a85e6298dc',
                'vibepulse_coins_500': 'https://apexmobilitysystem.lemonsqueezy.com/checkout/buy/99e508d1-36dc-4626-9b69-8ff687a41012',
                'vibepulse_coins_2000': 'https://apexmobilitysystem.lemonsqueezy.com/checkout/buy/169b81b9-a5f7-4ec9-899f-972b6d0b7b3f'
            };

            const checkoutUrl = cardPaymentLinks[sku];

            if (checkoutUrl) {
                window.open(checkoutUrl, '_blank');
            } else {
                alert(`Checkout link not found for ${coinAmount} Diamonds.`);
            }
        }
    </script>
</body>
</html>
