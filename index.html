<!-- Coin Recharge Store Modal (Google Play Billing Integrated) -->
<div class="tiktok-modal" id="shop-modal" onclick="if(event.target === this) closeTikTokModal('shop-modal')">
  <div class="modal-body-container">
    <div class="modal-header"><span>🪙 Google Play Coin Recharge</span><span class="modal-close" onclick="closeTikTokModal('shop-modal')">✕</span></div>
    <div style="background:#1c1c1e; padding:12px; border-radius:10px; display:flex; justify-content:space-between;">
      <div><div style="font-size:0.68rem; color:#a1a1aa;">My Coin Balance</div><div style="font-size:1.05rem; font-weight:bold; color:#facc15;" id="wallet-coins-count">🪙 0</div></div>
    </div>
    <div class="coin-grid-store" id="coin-packages-grid"></div>
    <button class="btn btn-primary" onclick="executeGooglePlayRecharge()">Buy via Google Play Billing 🚀</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB6Ikc36xV6Mh74kx6JYtyZVgcF0Hne6Qc",
  authDomain: "vibepulse-21950.firebaseapp.com",
  projectId: "vibepulse-21950",
  storageBucket: "vibepulse-21950.firebasestorage.app",
  messagingSenderId: "845177411967",
  appId: "1:845177411967:web:cc46d730fdd6b161a5224a"
};

let db = null, currentUser = null, selectedSku = 'vibepulse_coins_18';
let digitalGoodsService = null;

const coinProducts = [
  { sku: 'vibepulse_coins_18', coins: 18, priceVnd: '₫13,000' },
  { sku: 'vibepulse_coins_117', coins: 117, priceVnd: '₫26,000' },
  { sku: 'vibepulse_coins_397', coins: 397, priceVnd: '₫133,000' },
  { sku: 'vibepulse_coins_860', coins: 860, priceVnd: '₫266,000' }
];

function getDeviceUser() {
  let localId = localStorage.getItem('vibepulse_uid') || ('usr_' + Math.random().toString(36).substring(2, 9));
  localStorage.setItem('vibepulse_uid', localId);
  return { uid: localId };
}
const myDevice = getDeviceUser();

try {
  if (typeof firebase !== 'undefined') {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }
} catch(e) {}

window.addEventListener('DOMContentLoaded', async () => {
  renderCoinStoreGrid();
  fetchUserWalletBalance();

  // Initialize Google Play Digital Goods API if running inside Android TWA / Play Billing environment
  if ('getDigitalGoodsService' in window) {
    try {
      digitalGoodsService = await window.getDigitalGoodsService('https://play.google.com/billing');
      console.log("Google Play Billing Digital Goods API connected successfully.");
    } catch (error) {
      console.log("Google Play Billing service not available on this browser runtime (Fallback to test mode enabled).");
    }
  }
});

function renderCoinStoreGrid() {
  const grid = document.getElementById('coin-packages-grid');
  if (!grid) return;
  grid.innerHTML = '';
  coinProducts.forEach((pkg, idx) => {
    const card = document.createElement('div');
    card.className = `coin-card-item ${idx === 0 ? 'selected' : ''}`;
    if (idx === 0) selectedSku = pkg.sku;
    card.onclick = () => {
      document.querySelectorAll('.coin-card-item').forEach(el => el.classList.remove('selected'));
      card.classList.add('selected');
      selectedSku = pkg.sku;
    };
    card.innerHTML = `<div class="coin-card-title">🪙 ${pkg.coins} Coins</div><div class="coin-card-price">${pkg.priceVnd}</div>`;
    grid.appendChild(card);
  });
}

async function executeGooglePlayRecharge() {
  const pkg = coinProducts.find(p => p.sku === selectedSku);
  if (!pkg) { alert("Please select a coin package."); return; }

  // Check if native Google Play Billing API is available
  if (digitalGoodsService && window.PaymentRequest) {
    try {
      const paymentMethodData = [{
        supportedMethods: 'https://play.google.com/billing',
        data: { sku: pkg.sku }
      }];
      const paymentDetails = {
        total: { label: `Total (${pkg.coins} Coins)`, amount: { currency: 'VND', value: pkg.priceVnd.replace(/[^0-9]/g, '') } }
      };
      
      const request = new PaymentRequest(paymentMethodData, paymentDetails);
      const paymentResponse = await request.show();
      const purchaseToken = paymentResponse.details.purchaseToken;

      // Complete payment with Google Play
      await paymentResponse.complete('success');

      // Grant coins in Firestore backend database
      await creditUserCoins(pkg.coins, purchaseToken);
      alert(`🎉 Successfully purchased ${pkg.coins} coins via Google Play Billing!`);
      closeTikTokModal('shop-modal');
      return;
    } catch (err) {
      console.warn("Play Billing payment flow error or cancelled:", err);
    }
  }

  // Fallback / Simulator Mode for Web Testing or non-billing environments
  if (confirm(`[Play Billing Sandbox Simulation]\n\nAdd ${pkg.coins} coins to your account now?`)) {
    await creditUserCoins(pkg.coins, 'simulated_token_' + Date.now());
    alert(`🎉 Successfully added ${pkg.coins} coins to your wallet!`);
    closeTikTokModal('shop-modal');
  }
}

async function creditUserCoins(coinsToAdd, token) {
  const myUid = currentUser ? currentUser.uid : myDevice.uid;
  if (db) {
    const userRef = db.collection("users").doc(myUid);
    await userRef.set({
      coins: firebase.firestore.FieldValue.increment(coinsToAdd),
      lastPurchaseToken: token
    }, { merge: true });
    fetchUserWalletBalance();
  } else {
    let current = parseInt(localStorage.getItem('local_coins') || '0') + coinsToAdd;
    localStorage.setItem('local_coins', current);
    document.getElementById('wallet-coins-count').innerText = `🪙 ${current}`;
  }
}

function fetchUserWalletBalance() {
  const myUid = currentUser ? currentUser.uid : myDevice.uid;
  if (db) {
    db.collection("users").doc(myUid).get().then(doc => {
      if (doc.exists && doc.data().coins !== undefined) {
        document.getElementById('wallet-coins-count').innerText = `🪙 ${doc.data().coins}`;
      } else {
        document.getElementById('wallet-coins-count').innerText = `🪙 0`;
      }
    }).catch(() => {});
  } else {
    let current = localStorage.getItem('local_coins') || '0';
    document.getElementById('wallet-coins-count').innerText = `🪙 ${current}`;
  }
}

function toggleFeatureMenu() { document.getElementById('feature-dropdown-menu').classList.toggle('active'); }
function openTikTokModal(id) { document.getElementById(id).classList.add('active'); }
function closeTikTokModal(id) { document.getElementById(id).classList.remove('active'); }
function switchTab(tab) {}
function handleBackNavigation() { document.querySelectorAll('.tiktok-modal.active').forEach(m => m.classList.remove('active')); }
</script>
