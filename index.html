
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibePulse — Live Stream & Social App</title>

    <!-- Firebase Web SDK (v10 Compat Layer) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --accent: #2563eb;
            --accent-pink: #fe2c55;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header Bar */
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid #334155;
            z-index: 100;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .user-badge {
            font-size: 0.85rem;
            background: #334155;
            padding: 4px 8px;
            border-radius: 6px;
        }

        /* Main App Area */
        .main-content {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .live-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 60px;
            background: #0f172a;
            border-top: 1px solid #334155;
            z-index: 100;
        }

        .nav-item {
            color: var(--text-muted);
            background: none;
            border: none;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--text-light);
        }

        /* Dual Action Plus Button */
        .btn-plus {
            width: 44px;
            height: 32px;
            background: linear-gradient(90deg, #00f2fe 0%, #fe2c55 100%);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: bold;
            font-size: 1.4rem;
            border: none;
            cursor: pointer;
        }

        /* Modal Container */
        .tiktok-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 200;
            justify-content: center;
            align-items: flex-end;
        }

        .tiktok-modal.active {
            display: flex;
        }

        .modal-body-container {
            width: 100%;
            max-width: 500px;
            background: var(--bg-card);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .modal-close {
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .btn {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-secondary {
            background: #334155;
            color: white;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <!-- Header Navigation Bar -->
    <header class="header-bar">
        <button class="nav-item" onclick="history.back()">◄ Back</button>
        <span class="header-title">VibePulse</span>
        <div class="header-actions">
            <span class="user-badge" id="user-display">Guest</span>
            <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.8rem;" onclick="openTikTokModal('auth-modal')">Sign In</button>
        </div>
    </header>

    <!-- Main View Content -->
    <main class="main-content">
        <div class="live-preview" id="preview-area">
            🎥 Tap '+' to start streaming or share media
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-item active">🏠<span>Home</span></button>
        <button class="nav-item" onclick="openTikTokModal('shop-modal')">💎<span>Store</span></button>
        <button class="btn-plus" onclick="openTikTokModal('plus-modal')">+</button>
        <button class="nav-item">💬<span>Inbox</span></button>
        <button class="nav-item" onclick="openTikTokModal('auth-modal')">👤<span>Profile</span></button>
    </nav>

    <!-- 1. DUAL ACTION '+' MODAL -->
    <div class="tiktok-modal" id="plus-modal">
        <div class="modal-body-container">
            <div class="modal-header">
                <span>Create & Broadcast</span>
                <span class="modal-close" onclick="closeTikTokModal('plus-modal')">✕</span>
            </div>
            <button class="btn btn-primary" onclick="startLiveCamera()">🎥 Go Live Broadcast</button>
            <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">📁 Select Local Media File</button>
            <input type="file" id="file-input" style="display: none;" accept="video/*,image/*" onchange="handleFileSelect(event)">
        </div>
    </div>

    <!-- 2. AUTHENTICATION MODAL -->
    <div class="tiktok-modal" id="auth-modal">
        <div class="modal-body-container">
            <div class="modal-header">
                <span>Sign In or Register Account</span>
                <span class="modal-close" onclick="closeTikTokModal('auth-modal')">✕</span>
            </div>
            <input type="text" class="input-field" id="auth-username" placeholder="Account Handle / Username">
            <input type="email" class="input-field" id="auth-email" placeholder="Email Address">
            <input type="password" class="input-field" id="auth-password" placeholder="Password">
            <button class="btn btn-primary" onclick="handleAuth()">Sign In / Register Now</button>
        </div>
    </div>

    <!-- 3. CREDIT CARD CHECKOUT SHOP MODAL -->
    <div class="tiktok-modal" id="shop-modal">
        <div class="modal-body-container">
            <div class="modal-header">
                <span>💎 Diamond Coins Store</span>
                <span class="modal-close" onclick="closeTikTokModal('shop-modal')">✕</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                
                <!-- Tier 1: 100 Diamonds -->
                <div style="display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px; border-radius: 8px;">
                    <div>
                        <strong style="color: #fff; font-size: 1rem;">💎 100 Diamonds</strong>
                        <div style="font-size: 0.75rem; color: #94a3b8;">$1.00 USD</div>
                    </div>
                    <button class="btn btn-primary" onclick="buyCoinsCheckout('vibepulse_coins_100', 100, 1.00)">
                        Pay $1.00
                    </button>
                </div>

                <!-- Tier 2: 500 Diamonds -->
                <div style="display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px; border-radius: 8px;">
                    <div>
                        <strong style="color: #fff; font-size: 1rem;">💎 500 Diamonds</strong>
                        <div style="font-size: 0.75rem; color: #94a3b8;">$5.00 USD</div>
                    </div>
                    <button class="btn btn-primary" onclick="buyCoinsCheckout('vibepulse_coins_500', 500, 5.00)">
                        Pay $5.00
                    </button>
                </div>

                <!-- Tier 3: 2,000 Diamonds -->
                <div style="display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px; border-radius: 8px;">
                    <div>
                        <strong style="color: #fff; font-size: 1rem;">💎 2,000 Diamonds</strong>
                        <div style="font-size: 0.75rem; color: #94a3b8;">$20.00 USD</div>
                    </div>
                    <button class="btn btn-primary" onclick="buyCoinsCheckout('vibepulse_coins_2000', 2000, 20.00)">
                        Pay $20.00
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        // --- 1. SAFE FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY", // <--- Replace with real API key from Firebase Console
            authDomain: "vibepulse-21950.firebaseapp.com",
            projectId: "vibepulse-21950",
            storageBucket: "vibepulse-21950.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID", // <--- Replace with real Sender ID
            appId: "YOUR_APP_ID" // <--- Replace with real App ID
        };

        let auth, db;

        // Safely catch invalid config errors to prevent app freezing
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            auth = firebase.auth();
            db = firebase.firestore();

            // Monitor User Authentication State
            auth.onAuthStateChanged((user) => {
                if (user) {
                    document.getElementById('user-display').innerText = user.displayName || user.email.split('@')[0];
                } else {
                    document.getElementById('user-display').innerText = "Guest";
                }
            });
        } catch (e) {
            console.warn("Firebase initialized with missing credentials:", e);
        }

        // Modal Open/Close Controls
        function openTikTokModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.add('active');
        }

        function closeTikTokModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.remove('active');
        }

        // --- 2. AUTHENTICATION HANDLER ---
        function handleAuth() {
            if (!auth) {
                alert("Please add your real Firebase API Key inside index.html to enable login.");
                return;
            }

            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const username = document.getElementById('auth-username').value;

            if (!email || !password) {
                alert("Please fill in both email and password.");
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    closeTikTokModal('auth-modal');
                    alert("Signed in successfully!");
                })
                .catch((error) => {
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                        auth.createUserWithEmailAndPassword(email, password)
                            .then((userCredential) => {
                                if (username) {
                                    userCredential.user.updateProfile({ displayName: username });
                                }
                                closeTikTokModal('auth-modal');
                                alert("Account created and signed in!");
                            })
                            .catch(err => alert("Auth Error: " + err.message));
                    } else {
                        alert("Auth Error: " + error.message);
                    }
                });
        }

        // --- 3. DUAL ACTION '+' MEDIA HANDLERS ---
        function startLiveCamera() {
            closeTikTokModal('plus-modal');
            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then((stream) => {
                    const preview = document.getElementById('preview-area');
                    preview.innerHTML = `<video id="live-video" style="width:100%; height:100%; object-fit:cover;" autoplay playsinline></video>`;
                    document.getElementById('live-video').srcObject = stream;
                })
                .catch((err) => alert("Camera permission error: " + err.message));
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                closeTikTokModal('plus-modal');
                const fileUrl = URL.createObjectURL(file);
                const preview = document.getElementById('preview-area');
                if (file.type.startsWith('video/')) {
                    preview.innerHTML = `<video src="${fileUrl}" style="width:100%; height:100%; object-fit:cover;" controls autoplay></video>`;
                } else {
                    preview.innerHTML = `<img src="${fileUrl}" style="width:100%; height:100%; object-fit:cover;">`;
                }
            }
        }

        // --- 4. LIVE LEMON SQUEEZY CARD CHECKOUT PROCESSOR ---
        function buyCoinsCheckout(sku, coinAmount, priceUsd) {
            const cardPaymentLinks = {
                'vibepulse_coins_100': 'https://apexmobilitysystem.lemonsqueezy.com/checkout/buy/c9b4c4a0-21be-4d8a-a205-d0a85e6298dc',
                'vibepulse_coins_500': 'https://apexmobilitysystem.lemonsqueezy.com/checkout/buy/99e508d1-36dc-4626-9b69-8ff687a41012',
                'vibepulse_coins_2000': 'https://apexmobilitysystem.lemonsqueezy.com/checkout/buy/169b81b9-a5f7-4ec9-899f-972b6d0b7b3f'
            };

            const checkoutUrl = cardPaymentLinks[sku];

            if (checkoutUrl) {
                window.open(checkoutUrl, '_blank');
            } else {
                alert(`Checkout link not found for ${coinAmount} Diamonds.`);
            }
        }
    </script>
</body>
</html>
