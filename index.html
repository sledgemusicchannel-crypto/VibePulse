<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>VibePulse — Real-Time Social & Stream Network</title>

<!-- Lemon Squeezy SDK -->
<script src="https://assets.lemonsqueezy.com/lemon.js" defer></script>

<!-- Firebase Web SDK (v10 Compat Layer) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg-dark: #050505;
  --accent-pink: #fe2c55;
  --accent-cyan: #25f4ee;
  --accent-green: #22c55e;
  --card-bg: rgba(24, 24, 27, 0.90);
  --text-light: #ffffff;
  --text-muted: #a1a1aa;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-dark);
  color: var(--text-light);
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100svh;
  overflow: hidden;
  position: fixed;
  width: 100vw;
}

.app-viewport {
  flex: 1;
  position: relative;
  background: var(--bg-dark);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  width: 100%;
}

/* Top Bar Overlay */
.top-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: max(8px, env(safe-area-inset-top)) 10px 8px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 500;
  background: linear-gradient(180deg, rgba(5,5,5,0.95) 0%, rgba(5,5,5,0) 100%);
  gap: 4px;
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}
.top-overlay::-webkit-scrollbar { display: none; }

.left-header-group {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.back-nav-btn {
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
  padding: 5px 8px;
  border-radius: 12px;
  font-size: 0.68rem;
  font-weight: bold;
  cursor: pointer;
  flex-shrink: 0;
}

.brand-logo {
  font-size: 0.78rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 3px;
  white-space: nowrap;
}

.brand-badge {
  background: var(--accent-pink);
  font-size: 0.45rem;
  padding: 2px 4px;
  border-radius: 4px;
  font-weight: bold;
}

.avatar-ring-container {
  position: relative;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  padding: 2px;
  background: linear-gradient(135deg, #22c55e, #25f4ee);
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
  cursor: pointer;
  pointer-events: auto !important;
  z-index: 600 !important;
  flex-shrink: 0;
}

.avatar-ring-img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: #18181b;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 0.75rem;
  font-weight: bold;
  color: #fff;
}

.online-dot-badge {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 7px;
  height: 7px;
  background: #22c55e;
  border: 2px solid #000;
  border-radius: 50%;
}

.translator-top-bar {
  display: flex;
  align-items: center;
  gap: 3px;
  background: rgba(24, 24, 27, 0.85);
  padding: 3px 5px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  font-size: 0.6rem;
  backdrop-filter: blur(8px);
  flex-shrink: 0;
}

.translator-select {
  background: #09090b;
  color: #fff;
  border: 1px solid #3f3f46;
  padding: 2px 3px;
  border-radius: 6px;
  font-size: 0.6rem;
  outline: none;
  cursor: pointer;
  max-width: 65px;
}

.mic-btn {
  background: #25f4ee;
  color: #000;
  border: none;
  padding: 3px 6px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  font-size: 0.6rem;
  display: flex;
  align-items: center;
  gap: 2px;
  white-space: nowrap;
  pointer-events: auto !important;
  z-index: 600;
  touch-action: manipulation;
}

.right-header-group {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.active-users-pill {
  background: rgba(34, 197, 94, 0.2);
  border: 1px solid rgba(34, 197, 94, 0.5);
  color: #22c55e;
  padding: 3px 6px;
  border-radius: 12px;
  font-size: 0.6rem;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 3px;
  white-space: nowrap;
}

.menu-dropdown-btn {
  background: var(--accent-pink);
  color: white;
  border: none;
  padding: 5px 10px;
  border-radius: 14px;
  font-size: 0.7rem;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(254, 44, 85, 0.4);
  white-space: nowrap;
}

.feature-menu-panel {
  display: none;
  position: absolute;
  top: 50px;
  right: 10px;
  background: rgba(18, 18, 20, 0.96);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 14px;
  padding: 10px;
  width: 240px;
  z-index: 1000;
  box-shadow: 0 10px 30px rgba(0,0,0,0.85);
  flex-direction: column;
  gap: 6px;
  max-height: 75vh;
  overflow-y: auto;
}

.feature-menu-panel.active { display: flex !important; }

.menu-item-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: white;
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 0.75rem;
  font-weight: 600;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.menu-radio-section {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 8px;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 4px;
}

.menu-radio-title {
  font-size: 0.7rem;
  font-weight: bold;
  color: var(--accent-cyan);
  display: flex;
  align-items: center;
  gap: 4px;
}

.radio-select-menu {
  background: #18181b;
  color: white;
  border: 1px solid #3f3f46;
  padding: 5px;
  border-radius: 6px;
  font-size: 0.7rem;
  outline: none;
  width: 100%;
}

.radio-controls-row {
  display: flex;
  gap: 6px;
}

.radio-control-btn {
  flex: 1;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
  padding: 4px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.7rem;
  font-weight: bold;
  text-align: center;
}

/* Fixed Media Container - Contained Safely Behind Overlays */
.media-container {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--bg-dark);
  z-index: 1; /* Kept behind UI navigation overlays */
}

.video-feed-container {
  width: 100%;
  height: 100%;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.video-feed-container::-webkit-scrollbar { display: none; }

.video-feed-item {
  width: 100%;
  height: 100%;
  scroll-snap-align: start;
  position: relative;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
}

.video-feed-item video, .video-feed-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: auto;
}

.video-overlay-info {
  position: absolute;
  bottom: 90px;
  left: 12px;
  right: 75px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-shadow: 0 2px 6px rgba(0,0,0,0.9);
  pointer-events: none;
}

.video-author-name {
  font-size: 0.95rem;
  font-weight: 800;
  color: #fff;
}

.video-caption {
  font-size: 0.78rem;
  color: #f4f4f5;
  line-height: 1.25;
  max-height: 3.5em;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}

.video-side-actions {
  position: absolute;
  bottom: 95px;
  right: 12px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  pointer-events: auto !important;
}

.video-action-btn {
  background: none;
  border: none;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  font-size: 1.3rem;
  text-shadow: 0 2px 6px rgba(0,0,0,0.8);
  pointer-events: auto !important;
  position: relative;
}

.video-action-btn span {
  font-size: 0.65rem;
  font-weight: bold;
}

.video-delete-badge {
  position: absolute;
  top: 55px;
  right: 12px;
  background: rgba(239, 68, 68, 0.85);
  color: white;
  border: none;
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 0.7rem;
  font-weight: bold;
  cursor: pointer;
  z-index: 105 !important;
  pointer-events: auto !important;
}

.left-side-floating-controls {
  position: absolute;
  top: 80px;
  left: 12px;
  z-index: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  pointer-events: auto;
}

.floating-side-icon-btn {
  width: 40px;
  height: 40px;
  background: rgba(24, 24, 27, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 50%;
  font-size: 1.15rem;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,0,0,0.6);
  transition: transform 0.1s ease;
  touch-action: manipulation;
  color: white;
  position: relative;
}

.floating-side-icon-btn .count-badge {
  font-size: 0.6rem;
  font-weight: bold;
  position: absolute;
  bottom: -13px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.9);
}

.pk-split-container {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: #111;
  position: relative;
}

.pk-pane {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  border: 1px solid #333;
}

.pk-pane video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.pk-label-tag {
  position: absolute;
  top: 55px;
  left: 10px;
  background: rgba(0,0,0,0.7);
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 0.7rem;
  font-weight: bold;
  color: var(--accent-cyan);
  z-index: 10;
}

.live-pk-toggle-btn {
  position: absolute;
  bottom: 120px;
  right: 12px;
  background: linear-gradient(135deg, #fe2c55, #ff007f);
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 0.75rem;
  cursor: pointer;
  z-index: 950 !important;
  box-shadow: 0 4px 12px rgba(254, 44, 85, 0.5);
}

.media-placeholder {
  text-align: center;
  color: var(--text-light);
  font-size: 0.85rem;
  padding: 16px;
  width: 92%;
  max-width: 440px;
  background: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}

.bottom-overlay {
  position: absolute;
  bottom: 56px;
  left: 0;
  right: 0;
  padding: 6px 10px max(6px, env(safe-area-inset-bottom)) 10px;
  z-index: 800;
  background: linear-gradient(0deg, rgba(5,5,5,0.98) 0%, rgba(5,5,5,0.7) 70%, rgba(5,5,5,0) 100%);
  display: flex;
  flex-direction: column;
  gap: 4px;
  pointer-events: auto;
}

.chat-feed {
  max-height: 65px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding-right: 10px;
  scrollbar-width: none;
}
.chat-feed::-webkit-scrollbar { display: none; }

.chat-bubble {
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 4px 8px;
  border-radius: 8px;
  font-size: 0.73rem;
  color: #fff;
  width: fit-content;
  word-break: break-word;
}

.active-room-tag {
  align-self: flex-start;
  background: rgba(0, 0, 0, 0.65);
  padding: 2px 6px;
  border-radius: 8px;
  font-size: 0.6rem;
  font-weight: bold;
  color: var(--accent-cyan);
}

.chat-input-row {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  position: relative;
  z-index: 850;
}

.chat-input-wrapper {
  position: relative;
  flex: 1;
  display: flex;
  align-items: center;
}

.chat-input {
  width: 100%;
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.3);
  padding: 7px 38px 7px 12px;
  border-radius: 18px;
  color: white;
  font-size: 0.75rem;
  outline: none;
}

.emoji-picker-toggle {
  position: absolute;
  right: 8px;
  background: none;
  border: none;
  font-size: 1rem;
  cursor: pointer;
  z-index: 900;
  display: flex;
  align-items: center;
  justify-content: center;
}

.emoji-drawer {
  display: none;
  position: absolute;
  bottom: 44px;
  right: 0;
  background: rgba(24, 24, 27, 0.96);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 14px;
  padding: 8px;
  width: 260px;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
  z-index: 1100;
  box-shadow: 0 10px 25px rgba(0,0,0,0.85);
}
.emoji-drawer.active { display: grid !important; }

.emoji-item {
  background: none;
  border: none;
  font-size: 1.2rem;
  cursor: pointer;
  text-align: center;
  padding: 3px;
  border-radius: 6px;
}

.chat-send-btn {
  background: var(--accent-pink);
  color: white;
  border: none;
  padding: 7px 14px;
  border-radius: 18px;
  font-weight: bold;
  font-size: 0.75rem;
  cursor: pointer;
  flex-shrink: 0;
}

.bottom-nav {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 56px;
  background: #000000;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 900;
  padding-bottom: env(safe-area-inset-bottom);
}

.nav-item {
  color: var(--text-muted);
  background: none;
  border: none;
  font-size: 0.62rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
}

.nav-item.active { color: white; font-weight: bold; }

.btn-plus-tiktok {
  width: 38px;
  height: 25px;
  background: #fff;
  border-radius: 6px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  border: none;
}

.btn-plus-tiktok::before {
  content: '';
  position: absolute;
  left: -2px;
  width: 38px;
  height: 25px;
  background: var(--accent-cyan);
  border-radius: 6px;
  z-index: -1;
}

.btn-plus-tiktok::after {
  content: '';
  position: absolute;
  right: -2px;
  width: 38px;
  height: 25px;
  background: var(--accent-pink);
  border-radius: 6px;
  z-index: -2;
}

.btn-plus-icon { color: #000; font-weight: 900; font-size: 1.05rem; }

.tiktok-modal {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.75);
  z-index: 2000;
  justify-content: center;
  align-items: flex-end;
}
.tiktok-modal.active { display: flex !important; }

.modal-body-container {
  width: 100%;
  max-width: 480px;
  background: #18181b;
  border-top-left-radius: 16px;
  border-top-right-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: 85vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
  font-size: 0.95rem;
  padding-bottom: 8px;
  border-bottom: 1px solid #27272a;
}

.modal-close { cursor: pointer; font-size: 1.1rem; color: var(--text-muted); }
.btn { padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
.btn-primary { background: var(--accent-pink); color: white; }
.btn-secondary { background: #27272a; color: white; }
.btn-danger { background: #ef4444; color: white; }
.input-field { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #3f3f46; background: #09090b; color: white; font-size: 0.85rem; }

#effect-overlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  z-index: 2500;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 4rem;
  transition: all 0.5s ease;
  opacity: 0;
}
</style>
</head>
<body>

<div id="effect-overlay"></div>

<div class="left-side-floating-controls">
  <button class="floating-side-icon-btn" onclick="triggerLoveReaction()">❤️<span class="count-badge" id="left-love-counter-display">21</span></button>
  <button class="floating-side-icon-btn" onclick="triggerLaughEffect()">😂</button>
  <button class="floating-side-icon-btn" onclick="openDuetModal('')">👥</button>
</div>

<div class="app-viewport">
  <div class="top-overlay">
    <div class="left-header-group">
      <button class="back-nav-btn" onclick="handleBackNavigation()">◄ Back</button>
      <div class="avatar-ring-container" onclick="openTikTokModal('profile-modal')">
        <div class="avatar-ring-img" id="top-left-avatar-display">👤</div>
        <div class="online-dot-badge"></div>
      </div>
      <div class="brand-logo">⚡ VibePulse <span class="brand-badge">LIVE</span></div>
    </div>

    <div class="translator-top-bar">
      <select id="target-lang-select" class="translator-select">
        <option value="en">English</option>
        <option value="vi">Vietnamese</option>
      </select>
      <button type="button" class="mic-btn" onclick="openVoiceTranslatorModal()">🎤 Translate</button>
    </div>

    <div class="right-header-group">
      <div class="active-users-pill" onclick="openTikTokModal('active-users-modal')">🟢 <span id="top-hud-count">0</span> Online</div>
      <button class="menu-dropdown-btn" onclick="toggleFeatureMenu()">⚡ Menu</button>
    </div>
  </div>

  <div class="feature-menu-panel" id="feature-dropdown-menu">
    <button class="menu-item-btn" onclick="openTikTokModal('chatrooms-modal'); toggleFeatureMenu();">💬 Explore Chatrooms</button>
    <button class="menu-item-btn" onclick="startLiveCamera(); toggleFeatureMenu();">🔴 Go Live & PK Battle</button>
    <button class="menu-item-btn" onclick="triggerAction('jukebox'); toggleFeatureMenu();">🎵 YouTube Jukebox</button>
    <button class="menu-item-btn" onclick="triggerAction('gifts'); toggleFeatureMenu();">🎁 Send 100-Level Gifts</button>
    <button class="menu-item-btn" onclick="openTikTokModal('shop-modal'); toggleFeatureMenu();">🪙 Coin Recharge Store</button>
    <button class="menu-item-btn" onclick="openTikTokModal('profile-modal'); toggleFeatureMenu();">👤 Profile & Address Book</button>
  </div>

  <div class="media-container" id="preview-area">
    <div class="video-feed-container" id="ugc-video-feed">
      <div style="display:flex; justify-content:center; align-items:center; height:100%; color:#a1a1aa; font-size:0.85rem;">Loading Community Videos...</div>
    </div>
  </div>

  <div class="bottom-overlay">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div class="active-room-tag" id="current-room-label">Feed: Community Videos</div>
    </div>

    <div class="chat-feed" id="chat-messages-container">
      <div class="chat-bubble">🟢 <b>System:</b> Swipe up/down to watch videos, tap '+' to post your own video!</div>
    </div>

    <form class="chat-input-row" onsubmit="sendChatMessage(); return false;">
      <div class="chat-input-wrapper">
        <input type="text" class="chat-input" id="chat-box" placeholder="Say something about this video..." autocomplete="off">
        <button type="button" class="emoji-picker-toggle" onclick="toggleEmojiDrawer()">😊</button>
        <div class="emoji-drawer" id="emoji-popup-drawer">
          <button type="button" class="emoji-item" onclick="insertEmoji('😀')">😀</button>
          <button type="button" class="emoji-item" onclick="insertEmoji('😍')">😍</button>
          <button type="button" class="emoji-item" onclick="insertEmoji('🔥')">🔥</button>
          <button type="button" class="emoji-item" onclick="insertEmoji('❤️')">❤️</button>
        </div>
      </div>
      <button type="submit" class="chat-send-btn">Send</button>
    </form>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="switchTab('feed')">🏠<span>Home</span></button>
  <button class="nav-item" onclick="openTikTokModal('shop-modal')">🪙<span>Store</span></button>
  <button class="btn-plus-tiktok" onclick="openTikTokModal('plus-modal')"><span class="btn-plus-icon">+</span></button>
  <button class="nav-item" onclick="triggerAction('inbox')">💬<span>Inbox</span></button>
  <button class="nav-item" onclick="openTikTokModal('profile-modal')">👤<span>Profile</span></button>
</nav>

<script>
function toggleFeatureMenu() { document.getElementById('feature-dropdown-menu').classList.toggle('active'); }
function openTikTokModal(id) { document.getElementById(id).classList.add('active'); }
function closeTikTokModal(id) { document.getElementById(id).classList.remove('id'); }
function switchTab(tab) { document.getElementById('preview-area').innerHTML = `<div class="video-feed-container" id="ugc-video-feed"></div>`; }
function triggerLoveReaction() { alert("Liked!"); }
function triggerLaughEffect() { alert("Haha!"); }
function openDuetModal() {}
function openVoiceTranslatorModal() {}
function toggleEmojiDrawer() { document.getElementById('emoji-popup-drawer').classList.toggle('active'); }
function insertEmoji(e) { document.getElementById('chat-box').value += e; document.getElementById('emoji-popup-drawer').classList.remove('active'); }
function sendChatMessage() { alert("Sent!"); }
function triggerAction(act) { alert(act); }
</script>
</body>
</html>
