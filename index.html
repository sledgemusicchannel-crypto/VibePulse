<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VibePulse Live</title>

    <!-- Lemon Squeezy SDK -->
    <script src="https://assets.lemonsqueezy.com/lemon.js" defer></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            background-color: #000000;
        }

        /* Top Bar Header */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #6366f1;
        }

        .diamond-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(99, 102, 241, 0.25);
            border: 1px solid #6366f1;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: #38bdf8;
            backdrop-filter: blur(10px);
        }

        /* Fullscreen Video Viewport */
        .video-viewport {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Bottom Interactive Bar */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 12px 18px;
            border-radius: 24px;
            color: #fff;
            outline: none;
            backdrop-filter: blur(10px);
            font-size: 0.95rem;
        }

        .chat-input::placeholder {
            color: #cbd5e1;
        }

        .store-trigger-btn {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            padding: 12px 22px;
            border-radius: 24px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
            font-size: 0.95rem;
        }

        /* Store Bottom Drawer */
        .store-modal {
            position: absolute;
            bottom: -100%;
            left: 0;
            right: 0;
            height: 65%;
            background: #1e293b;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            z-index: 20;
            padding: 24px;
            transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.6);
        }

        .store-modal.open {
            bottom: 0;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1.8rem;
            cursor: pointer;
            line-height: 1;
        }

        .package-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .package-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #334155;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #475569;
        }

        .buy-btn {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Bar Header -->
        <div class="header">
            <div class="user-info">
                <div class="user-avatar"></div>
                <span id="display-name">Guest User</span>
            </div>
            <div class="diamond-badge" onclick="toggleStore(true)">
                💎 <span id="user-diamonds">0</span>
            </div>
        </div>

        <!-- Fullscreen Stream Player -->
        <video class="video-viewport" autoplay loop muted playsinline poster="https://via.placeholder.com/600x1200/000000/ffffff?text=VibePulse+Live">
            <source src="" type="video/mp4">
        </video>

        <!-- Bottom Overlay Controls -->
        <div class="bottom-bar">
            <input type="text" class="chat-input" placeholder="Send a comment...">
            <button class="store-trigger-btn" onclick="toggleStore(true)">Store</button>
        </div>

        <!-- Store Drawer -->
        <div class="store-modal" id="storeModal">
            <div class="modal-header">
                <h3>💎 Top Up Diamonds</h3>
                <button class="close-btn" onclick="toggleStore(false)">&times;</button>
            </div>
            <div class="package-list">
                <div class="package-item">
                    <div>
                        <strong>100 Diamonds</strong>
                        <p style="font-size: 0.8rem; color: #9ca3af;">Basic Bundle</p>
                    </div>
                    <button class="buy-btn" onclick="openCheckout('YOUR_100_DIAMONDS_CHECKOUT_URL', 100)">Buy</button>
                </div>
                <div class="package-item">
                    <div>
                        <strong>500 Diamonds</strong>
                        <p style="font-size: 0.8rem; color: #9ca3af;">Popular Pack</p>
                    </div>
                    <button class="buy-btn" onclick="openCheckout('YOUR_500_DIAMONDS_CHECKOUT_URL', 500)">Buy</button>
                </div>
                <div class="package-item">
                    <div>
                        <strong>2000 Diamonds</strong>
                        <p style="font-size: 0.8rem; color: #9ca3af;">Pro Tier</p>
                    </div>
                    <button class="buy-btn" onclick="openCheckout('YOUR_2000_DIAMONDS_CHECKOUT_URL', 2000)">Buy</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Firebase Initialization ---
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUserId = null;
        let pendingDiamondAmount = 0;

        // --- 2. Auth State & Real-time Balance Listener ---
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUserId = user.uid;
                document.getElementById("display-name").innerText = user.displayName || "Vibe Member";
                
                db.collection("users").doc(currentUserId).onSnapshot((doc) => {
                    if (doc.exists) {
                        const balance = doc.data().diamonds || 0;
                        document.getElementById("user-diamonds").innerText = balance;
                    }
                });
            }
        });

        // --- 3. Lemon Squeezy SDK Setup ---
        window.createLemonSqueezy = () => {
            LemonSqueezy.Setup({
                eventHandler: (event) => {
                    if (event.event === 'Checkout.Success') {
                        creditDiamondsToUser();
                        toggleStore(false);
                    }
                }
            });
        };

        function toggleStore(show) {
            const modal = document.getElementById("storeModal");
            if (show) {
                modal.classList.add("open");
            } else {
                modal.classList.remove("open");
            }
        }

        function openCheckout(checkoutUrl, diamondAmount) {
            if (!currentUserId) {
                alert("Please log in to purchase diamonds.");
                return;
            }
            pendingDiamondAmount = diamondAmount;

            const urlWithUser = `${checkoutUrl}?checkout[custom][user_id]=${currentUserId}`;
            
            if (window.LemonSqueezy) {
                LemonSqueezy.Url.Open(urlWithUser);
            } else {
                window.location.href = urlWithUser;
            }
        }

        function creditDiamondsToUser() {
            if (!currentUserId || pendingDiamondAmount <= 0) return;

            db.collection("users").doc(currentUserId).set({
                diamonds: firebase.firestore.FieldValue.increment(pendingDiamondAmount)
            }, { merge: true })
            .then(() => {
                alert(`🎉 Success! ${pendingDiamondAmount} Diamonds credited.`);
                pendingDiamondAmount = 0;
            })
            .catch((error) => {
                console.error("Error updating diamond balance:", error);
            });
        }
    </script>
</body>
</html>
